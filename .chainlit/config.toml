[project]
enable_telemetry = false
user_env = []
session_timeout = 3600
cache = false

[features]
unsafe_allow_html = false
latex = true
auto_tag_thread = true

[UI]
name = "Course Agent"
default_expand_messages = false
hide_cot = false
default_collapse_content = true

[UI.theme]
default = "light"
    [UI.theme.light]
    background = "#FAFAFA"
    paper = "#FFFFFF"
        [UI.theme.light.primary]
        main = "#4F46E5"
        dark = "#4338CA"
        light = "#6366F1"
    [UI.theme.dark]
    background = "#1E1E2F"
    paper = "#27293D"
        [UI.theme.dark.primary]
        main = "#818CF8"
        dark = "#6366F1"
        light = "#A5B4FC"

[meta]
generated_by = "course-agent"
