app:
  name: course_agent
  version: "0.1.0"

llm:
  provider: mock          # mock | openai
  model: gpt-4o-mini
  temperature: 0.2
  max_tokens: 1024

agent:
  max_steps: 8
  timeout_seconds: 120

runtime:
  backend: langgraph              # legacy | langgraph（多 Agent Orchestrator）
  agent_loop_backend: legacy      # legacy | langgraph（单 Agent chat / react 模式）
  checkpoint: memory              # none | memory | sqlite
  draw_graph: true
  trace_dir: data/replays

mcp:
  enabled: false
  servers:
    - name: demo
      transport: mock
      timeout_s: 15
      enabled: true

logging:
  level: INFO
